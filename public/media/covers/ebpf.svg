<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b1020"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#acc)"/>

  <text x="80" y="140" font-family="-apple-system,PingFang SC,sans-serif" font-size="20"
        fill="#22d3ee" font-weight="600">eBPF 与系统观测</text>

  <text x="80" y="220" font-family="-apple-system,PingFang SC,sans-serif" font-size="52"
        font-weight="800" fill="#e8ecf5" letter-spacing="-1.5">eBPF 观测 Java 进程</text>
  <text y="290" x="80" font-family="-apple-system,PingFang SC,sans-serif" font-size="52"
        font-weight="800" fill="url(#acc)" letter-spacing="-1.5">不改代码拿到系统级真相</text>

  <!-- JVM / kernel 边界示意 -->
  <g transform="translate(80 372)">
    <rect width="440" height="76" rx="12" fill="#151d2e" stroke="#26305a"/>
    <text x="24" y="34" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#a5b4fc">JFR · jcmd · async-profiler</text>
    <text x="24" y="60" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" fill="#64748b">JVM 愿意暴露的事实</text>
  </g>
  <g transform="translate(560 372)">
    <rect width="440" height="76" rx="12" fill="#151d2e" stroke="#164e63"/>
    <text x="24" y="34" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#22d3ee">eBPF · bpftrace · offcputime</text>
    <text x="24" y="60" font-family="-apple-system,PingFang SC,sans-serif" font-size="15" fill="#64748b">内核实际看到的事实</text>
  </g>

  <text x="80" y="576" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#475569">
    xpbob.site</text>
</svg>
