  </defs>

  <rect width="1200" height="630" fill="#17120e"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#acc)"/>

  <g transform="translate(88 200)">
