    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#ef8b2c" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ef8b2c" stop-opacity="0"/>
